<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantau Tim — Rekapitulasi Real-Time</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #1e3a8a;
      --primary-soft: #dbeafe;
      --green: #059669;
      --green-soft: #d1fae5;
      --amber: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 32px;
    }

    /* Header */
    .topbar {
      background: var(--primary);
      color: #fff;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
    }

    .topbar-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .status-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #cbd5e1;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      display: inline-block;
    }

    .dot.offline {
      background: #f87171;
    }

    .btn-login {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      white-space: nowrap;
    }

    /* Container */
    .container {
      max-width: 720px;
      margin: 16px auto 0;
      padding: 0 14px;
    }

    /* Alert Error */
    .alert {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }

    /* Ringkasan Utama */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 480px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .card-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .card-value {
      font-size: 28px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .card-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .progress-bg {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      background: var(--green);
      border-radius: 99px;
      width: 0%;
      transition: width 0.4s ease;
    }

    .progress-fill.blue {
      background: var(--primary);
    }

    /* Section Header */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 20px 0 10px;
    }

    .section-head h2 {
      font-size: 15px;
      font-weight: 700;
    }

    .btn-refresh {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Daftar Desa */
    .desa-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .desa-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .desa-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .desa-name {
      font-weight: 700;
      font-size: 15px;
    }

    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--primary-soft);
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    .desa-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 8px;
      font-variant-numeric: tabular-nums;
    }

    .desa-stats strong {
      color: var(--text);
    }

    .empty-box {
      background: var(--card);
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .footer-info {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>PANTAU TIM</h1>
        <div class="status-live">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Menghubungkan...</span>
        </div>
      </div>
      <a href="login.html" class="btn-login">Login Tim →</a>
    </div>
  </header>

  <main class="container">
    <div class="alert" id="errorBox"></div>

    <!-- Kartu Ringkasan -->
    <section class="grid-2">
      <div class="card">
        <div class="card-label">KTP Terkumpul</div>
        <div class="card-value" id="totalKtp">0</div>
        <div class="card-sub" id="subKtp">Target: 0 KTP (0%)</div>
        <div class="progress-bg">
          <div class="progress-fill" id="barKtp"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-label">Perolehan Suara</div>
        <div class="card-value" id="totalSuara">0</div>
        <div class="card-sub" id="subSuara">TPS Masuk: 0 / 0 TPS</div>
        <div class="progress-bg">
          <div class="progress-fill blue" id="barTps"></div>
        </div>
      </div>
    </section>

    <!-- Rincian Per Desa -->
    <div class="section-head">
      <h2>Rekapitulasi Per Desa</h2>
      <button class="btn-refresh" id="btnRefresh">↻ Perbarui</button>
    </div>

    <div class="desa-list" id="desaList">
      <div class="empty-box">Memuat data dari server...</div>
    </div>

    <div class="footer-info" id="lastUpdate">Belum diperbarui</div>
  </main>

  <script type="module">
    import { supabase } from './js/config.js';

    const elTotalKtp = document.getElementById('totalKtp');
    const elSubKtp = document.getElementById('subKtp');
    const elBarKtp = document.getElementById('barKtp');
    const elTotalSuara = document.getElementById('totalSuara');
    const elSubSuara = document.getElementById('subSuara');
    const elBarTps = document.getElementById('barTps');
    const elDesaList = document.getElementById('desaList');
    const elError = document.getElementById('errorBox');
    const elDot = document.getElementById('statusDot');
    const elStatus = document.getElementById('statusText');
    const elLastUpdate = document.getElementById('lastUpdate');

    const formatAngka = (num) => Number(num || 0).toLocaleString('id-ID');

    async function muatRingkasan() {
      try {
        const { data, error } = await supabase.rpc('get_ringkasan_calon');
        if (error) throw error;

        elError.style.display = 'none';
        elDot.classList.remove('offline');
        elStatus.textContent = 'Live • Terhubung';

        // 1. Update KTP
        const totalKtp = data.total_ktp || 0;
        const targetKtp = data.target_ktp || 0;
        const persenKtp = targetKtp > 0 ? Math.min(100, Math.round((totalKtp / targetKtp) * 100)) : 0;

        elTotalKtp.textContent = formatAngka(totalKtp);
        elSubKtp.textContent = `Target: ${formatAngka(targetKtp)} KTP (${persenKtp}%)`;
        elBarKtp.style.width = `${persenKtp}%`;

        // 2. Update Suara & TPS
        const suaraCalon = data.total_suara_calon || 0;
        const tpsMasuk = data.tps_masuk || 0;
        const totalTps = data.total_tps || 0;
        const persenTps = totalTps > 0 ? Math.min(100, Math.round((tpsMasuk / totalTps) * 100)) : 0;

        elTotalSuara.textContent = formatAngka(suaraCalon);
        elSubSuara.textContent = `TPS Masuk: ${formatAngka(tpsMasuk)} / ${formatAngka(totalTps)} TPS (${persenTps}%)`;
        elBarTps.style.width = `${persenTps}%`;

        // 3. Render Per Desa
        const daftarDesa = data.per_desa || [];
        if (daftarDesa.length === 0) {
          elDesaList.innerHTML = `
            <div class="empty-box">
              Belum ada data desa yang dimasukkan.<br>
              Silakan tambahkan daftar desa melalui menu Admin nanti.
            </div>`;
        } else {
          elDesaList.innerHTML = daftarDesa.map((d) => {
            const pDesa = d.target_ktp > 0 ? Math.round((d.jumlah_ktp / d.target_ktp) * 100) : 0;
            return `
              <div class="desa-item">
                <div class="desa-top">
                  <span class="desa-name">${d.nama_desa}</span>
                  <span class="badge">${pDesa}% Target KTP</span>
                </div>
                <div class="desa-stats">
                  <div>KTP: <strong>${formatAngka(d.jumlah_ktp)}</strong> / ${formatAngka(d.target_ktp)}</div>
                  <div>Suara: <strong>${formatAngka(d.suara_calon)}</strong> (${d.tps_masuk}/${d.total_tps} TPS)</div>
                </div>
              </div>
            `;
          }).join('');
        }

        const jam = new Date().toLocaleTimeString('id-ID');
        elLastUpdate.textContent = `Terakhir diperbarui: ${jam} WIB (otomatis tiap 10 detik)`;
      } catch (err) {
        elDot.classList.add('offline');
        elStatus.textContent = 'Terputus';
        elError.style.display = 'block';
        elError.textContent = `Gagal terhubung ke database: ${err.message}. Pastikan js/config.js sudah diisi dengan benar.`;
      }
    }

    document.getElementById('btnRefresh').addEventListener('click', muatRingkasan);

    // Jalankan pertama kali & ulangi otomatis tiap 10 detik
    muatRingkasan();
    setInterval(muatRingkasan, 10000);
  </script>
</body>
</html>
