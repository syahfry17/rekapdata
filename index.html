<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANTAU TIM — Rekapitulasi Live</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      font-family: 'Segoe UI', Roboto, sans-serif;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f4fc;
      padding: 16px;
      color: #0f172a;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    /* HEADER GRADIENT */
    .dash-header {
      background: linear-gradient(135deg, #0B2C70, #1E4BB8);
      color: #ffffff;
      padding: 20px 22px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(11, 44, 112, 0.25);
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .dash-header h2 {
      font-weight: 800;
      font-size: 20px;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }

    .dash-header p {
      opacity: 0.92;
      font-size: 13px;
    }

    .btn-admin-link {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.28);
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    .btn-admin-link:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    /* GRID KARTU STATISTIK */
    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: #ffffff;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(11, 44, 112, 0.12);
      transition: transform 0.2s ease;
    }

    .stat-card:active {
      transform: translateY(-3px);
    }

    .stat-card h4 {
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
    }

    .stat-card .angka {
      font-size: 24px;
      font-weight: 800;
      color: #1E4BB8;
      margin: 4px 0;
      word-break: break-word;
    }

    .stat-card .keterangan {
      font-size: 13px;
      color: #0B2C70;
      font-weight: 600;
    }

    /* KONTAINER GRAFIK */
    .chart-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(11, 44, 112, 0.12);
      margin-bottom: 18px;
    }

    .chart-container h3 {
      color: #0B2C70;
      text-align: center;
      margin-bottom: 14px;
      font-size: 15px;
      font-weight: 800;
    }

    .donut-wrap {
      max-width: 280px;
      margin: 0 auto;
    }

    .bar-wrap {
      position: relative;
      width: 100%;
      min-height: 250px;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="dash-header">
      <div>
        <h2>PANTAU TIM</h2>
        <p id="statusLive">🟡 Menghubungkan...</p>
      </div>
      <a href="admin.html" class="btn-admin-link">Panel Admin →</a>
    </div>

    <!-- KARTU STATISTIK -->
    <div class="card-grid">
      <div class="stat-card">
        <h4>KTP TERKUMPUL</h4>
        <div class="angka" id="statKtp">0 / 0</div>
        <div class="keterangan" id="ketPersenKtp">⏳ 0% Target</div>
      </div>

      <div class="stat-card">
        <h4>SUARA MASUK</h4>
        <div class="angka" id="statSuara">0</div>
        <div class="keterangan" id="ketTpsMasuk">🗳️ 0 / 0 TPS</div>
      </div>

      <div class="stat-card">
        <h4>TARGET KESELURUHAN</h4>
        <div class="angka" id="statTarget">0</div>
        <div class="keterangan">📋 Total Target KTP</div>
      </div>

      <div class="stat-card">
        <h4>TPS TERDAFTAR</h4>
        <div class="angka" id="statTotalTps">0</div>
        <div class="keterangan">🗳️ Jumlah TPS</div>
      </div>
    </div>

    <!-- GRAFIK DONUT PROGRESS -->
    <div class="chart-container">
      <h3>📊 PROGRESS TARGET KTP</h3>
      <div class="donut-wrap">
        <canvas id="circleChart"></canvas>
      </div>
    </div>

    <!-- GRAFIK BATANG PEROLEHAN SUARA -->
    <div class="chart-container">
      <h3>📈 PEROLEHAN SUARA PER KECAMATAN</h3>
      <div class="bar-wrap">
        <canvas id="barChart"></canvas>
      </div>
    </div>

    <div class="footer-note" id="lastUpdateText">Memuat data terbaru...</div>
  </div>

  <script type="module">
    import { supabase } from './js/config.js';

    let donutChart = null;
    let barChart = null;

    function initCharts() {
      const circleCtx = document.getElementById('circleChart').getContext('2d');
      donutChart = new Chart(circleCtx, {
        type: 'doughnut',
        data: {
          labels: ['Tercapai ✅', 'Belum Tercapai ⏳'],
          datasets: [{
            data: [0, 100],
            backgroundColor: ['#1E4BB8', '#cbd5e1'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          cutout: '66%',
          plugins: {
            legend: {
              position: 'bottom',
              labels: { font: { weight: 'bold', size: 12 } }
            }
          }
        }
      });

      const barCtx = document.getElementById('barChart').getContext('2d');
      barChart = new Chart(barCtx, {
        type: 'bar',
        data: {
          labels: [],
          datasets: [{
            label: 'Jumlah Suara',
            data: [],
            backgroundColor: '#1E4BB8',
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { precision: 0 }
            }
          }
        }
      });
    }

    async function muatDashboardLive() {
      const statusEl = document.getElementById('statusLive');

      try {
        const [
          { data: dKec, error: errKec },
          { data: dDesa, error: errDesa },
          { count: totalTps, error: errTps },
          { data: dKtpRows, count: totalKtp, error: errKtp },
          { data: dSuara, error: errSuara }
        ] = await Promise.all([
          supabase.from('kecamatan').select('id, nama_kecamatan').order('nama_kecamatan', { ascending: true }),
          supabase.from('desa').select('id, kecamatan_id, target_ktp'),
          supabase.from('tps').select('id', { count: 'exact' }),
          supabase.from('data_ktp').select('id', { count: 'exact' }),
          supabase.from('suara_tps').select('suara_calon, desa(kecamatan_id)')
        ]);

        if (errKec || errDesa || errTps || errKtp || errSuara) {
          throw errKec || errDesa || errTps || errKtp || errSuara;
        }

        const ktpMasuk = Number(totalKtp ?? (dKtpRows ? dKtpRows.length : 0));
        const tpsSemua = Number(totalTps || 0);
        const targetKtp = (dDesa || []).reduce((acc, d) => acc + Number(d.target_ktp || 0), 0);

        const persenRaw = targetKtp > 0 ? (ktpMasuk / targetKtp) * 100 : 0;
        const persenBulat = targetKtp > 0
          ? (persenRaw > 0 && persenRaw < 1 ? 1 : Math.min(100, Math.round(persenRaw)))
          : 0;
        const sisaPersen = Math.max(0, 100 - persenBulat);

        const suaraList = dSuara || [];
        const totalSuara = suaraList.reduce((acc, s) => acc + Number(s.suara_calon || 0), 0);
        const tpsMasuk = suaraList.length;

        document.getElementById('statKtp').textContent = `${ktpMasuk.toLocaleString('id-ID')} / ${targetKtp.toLocaleString('id-ID')}`;
        document.getElementById('ketPersenKtp').textContent = `✅ ${persenBulat}% Target`;

        document.getElementById('statSuara').textContent = totalSuara.toLocaleString('id-ID');
        document.getElementById('ketTpsMasuk').textContent = `✅ ${tpsMasuk.toLocaleString('id-ID')} / ${tpsSemua.toLocaleString('id-ID')} TPS`;

        document.getElementById('statTarget').textContent = targetKtp.toLocaleString('id-ID');
        document.getElementById('statTotalTps').textContent = tpsSemua.toLocaleString('id-ID');

        if (donutChart) {
          donutChart.data.datasets[0].data = targetKtp > 0 ? [persenBulat, sisaPersen] : [0, 100];
          donutChart.update();
        }

        const suaraPerKec = new Map();
        (dKec || []).forEach(k => suaraPerKec.set(k.id, 0));

        suaraList.forEach(s => {
          const kecId = s.desa?.kecamatan_id;
          if (kecId && suaraPerKec.has(kecId)) {
            suaraPerKec.set(kecId, suaraPerKec.get(kecId) + Number(s.suara_calon || 0));
          }
        });

        const labelsKec = (dKec || []).map(k => k.nama_kecamatan);
        const dataSuaraKec = (dKec || []).map(k => suaraPerKec.get(k.id) || 0);

        if (barChart) {
          barChart.data.labels = labelsKec;
          barChart.data.datasets[0].data = dataSuaraKec;
          barChart.update();
        }

        statusEl.textContent = '🟢 Live • Terhubung';
        document.getElementById('lastUpdateText').textContent =
          `Pembaruan terakhir: ${new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' })} WIB`;
      } catch (err) {
        statusEl.textContent = '🔴 Gagal memuat data';
        document.getElementById('lastUpdateText').textContent = `Error: ${err.message}`;
      }
    }

    initCharts();
    await muatDashboardLive();

    supabase
      .channel('pantau-live-dashboard')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'data_ktp' }, muatDashboardLive)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'suara_tps' }, muatDashboardLive)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'desa' }, muatDashboardLive)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tps' }, muatDashboardLive)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'kecamatan' }, muatDashboardLive)
      .subscribe();
  </script>
</body>
</html>
