<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANTAU TIM — Rekapitulasi Live</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      font-family: 'Segoe UI', Roboto, sans-serif;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f4fc;
      padding: 16px;
      color: #0f172a;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    /* HEADER GRADIENT */
    .dash-header {
      background: linear-gradient(135deg, #0B2C70, #1E4BB8);
      color: #ffffff;
      padding: 20px 22px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(11, 44, 112, 0.25);
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .dash-header h2 {
      font-weight: 800;
      font-size: 20px;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }

    .dash-header p {
      opacity: 0.92;
      font-size: 13px;
    }

    .btn-admin-link {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.28);
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    .btn-admin-link:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    /* GRID KARTU STATISTIK */
    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: #ffffff;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(11, 44, 112, 0.12);
      transition: transform 0.2s ease;
    }

    .stat-card:active {
      transform: translateY(-3px);
    }

    .stat-card h4 {
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
    }

    .stat-card .angka {
      font-size: 24px;
      font-weight: 800;
      color: #1E4BB8;
      margin: 4px 0;
      word-break: break-word;
    }

    .stat-card .keterangan {
      font-size: 13px;
      color: #0B2C70;
      font-weight: 600;
    }

    /* KONTAINER GRAFIK */
    .chart-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(11, 44, 112, 0.12);
      margin-bottom: 18px;
    }

    .chart-header-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .chart-container h3 {
      color: #0B2C70;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
    }

    .filter-kec-select {
      width: 100%;
      max-width: 320px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background-color: #f8fafc;
      color: #0f172a;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    .filter-kec-select:focus {
      border-color: #1E4BB8;
      background-color: #ffffff;
    }

    .donut-wrap {
      max-width: 280px;
      margin: 0 auto;
    }

    .bar-wrap {
      position: relative;
      width: 100%;
      min-height: 270px;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="dash-header">
      <div>
        <h2>PANTAU TIM</h2>
        <p id="statusLive">🟡 Menghubungkan...</p>
      </div>
      <a href="admin.html" class="btn-admin-link">Panel Admin →</a>
    </div>

    <!-- KARTU STATISTIK -->
    <div class="card-grid">
      <div class="stat-card">
        <h4>KTP TERKUMPUL</h4>
        <div class="angka" id="statKtp">0 / 0</div>
        <div class="keterangan" id="ketPersenKtp">⏳ 0% Target</div>
      </div>

      <div class="stat-card">
        <h4>SUARA MASUK</h4>
        <div class="angka" id="statSuara">0</div>
        <div class="keterangan" id="ketTpsMasuk">🗳️ 0 / 0 TPS</div>
      </div>

      <div class="stat-card">
        <h4>TARGET KESELURUHAN</h4>
        <div class="angka" id="statTarget">0</div>
        <div class="keterangan">📋 Total Target KTP</div>
      </div>

      <div class="stat-card">
        <h4>TPS TERDAFTAR</h4>
        <div class="angka" id="statTotalTps">0</div>
        <div class="keterangan" id="ketTotalTps">🗳️ Jumlah TPS</div>
      </div>
    </div>

    <!-- GRAFIK DONUT PROGRESS -->
    <div class="chart-container">
      <h3>📊 PROGRESS TARGET KTP</h3>
      <div class="donut-wrap">
        <canvas id="circleChart"></canvas>
      </div>
    </div>

    <!-- GRAFIK BATANG PERBANDINGAN KTP VS SUARA -->
    <div class="chart-container">
      <div class="chart-header-row">
        <h3 id="judulGrafikBatang">📈 KTP TERKUMPUL VS SUARA PER KECAMATAN</h3>
        <select id="filterKecGrafik" class="filter-kec-select" aria-label="Filter Kecamatan Grafik">
          <option value="">Semua Kecamatan (Rekap Kecamatan)</option>
        </select>
      </div>
      <div class="bar-wrap">
        <canvas id="barChart"></canvas>
      </div>
    </div>

    <div class="footer-note" id="lastUpdateText">Memuat data terbaru...</div>
  </div>

  <script type="module">
    import { supabase } from './js/config.js';

    let donutChart = null;
    let barChart = null;
    let slidesTps = [];
    let slideIndex = 0;

    // Cache data untuk ganti filter kecamatan secara instan tanpa query ulang berlebih
    let cacheKec = [];
    let cacheDesa = [];
    let cacheKtpRows = [];
    let cacheSuaraList = [];

    const filterKecEl = document.getElementById('filterKecGrafik');

    function tampilkanSlideTps() {
      const angkaEl = document.getElementById('statTotalTps');
      const ketEl = document.getElementById('ketTotalTps');
      if (!angkaEl || !ketEl || slidesTps.length === 0) return;

      const aktif = slidesTps[slideIndex % slidesTps.length];
      angkaEl.textContent = Number(aktif.jumlah || 0).toLocaleString('id-ID');
      ketEl.textContent = aktif.label;
    }

    setInterval(() => {
      if (slidesTps.length > 1) {
        slideIndex = (slideIndex + 1) % slidesTps.length;
        tampilkanSlideTps();
      }
    }, 10000);

    function initCharts() {
      const circleCtx = document.getElementById('circleChart').getContext('2d');
      donutChart = new Chart(circleCtx, {
        type: 'doughnut',
        data: {
          labels: ['Tercapai ✅', 'Belum Tercapai ⏳'],
          datasets: [{
            data: [0, 100],
            backgroundColor: ['#1E4BB8', '#cbd5e1'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          cutout: '66%',
          plugins: {
            legend: {
              position: 'bottom',
              labels: { font: { weight: 'bold', size: 12 } }
            }
          }
        }
      });

      const barCtx = document.getElementById('barChart').getContext('2d');
      barChart = new Chart(barCtx, {
        type: 'bar',
        data: {
          labels: [],
          datasets: [
            {
              label: 'KTP Terkumpul',
              data: [],
              backgroundColor: '#38bdf8',
              borderRadius: 6
            },
            {
              label: 'Suara Masuk',
              data: [],
              backgroundColor: '#0B2C70',
              borderRadius: 6
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { font: { weight: 'bold', size: 12 } }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { precision: 0 }
            }
          }
        }
      });
    }

    function updateGrafikBatang() {
      if (!barChart) return;

      const selectedKecId = filterKecEl.value;
      const judulEl = document.getElementById('judulGrafikBatang');

      const desaToKec = new Map();
      cacheDesa.forEach(d => {
        if (d.kecamatan_id) desaToKec.set(d.id, d.kecamatan_id);
      });

      if (!selectedKecId) {
        judulEl.textContent = '📈 KTP TERKUMPUL VS SUARA PER KECAMATAN';

        const ktpPerKec = new Map();
        const suaraPerKec = new Map();
        cacheKec.forEach(k => {
          ktpPerKec.set(k.id, 0);
          suaraPerKec.set(k.id, 0);
        });

        cacheKtpRows.forEach(row => {
          const kecId = row.desa?.kecamatan_id || desaToKec.get(row.desa_id);
          if (kecId && ktpPerKec.has(kecId)) {
            ktpPerKec.set(kecId, ktpPerKec.get(kecId) + 1);
          }
        });

        cacheSuaraList.forEach(s => {
          const kecId = s.desa?.kecamatan_id || desaToKec.get(s.desa_id);
          if (kecId && suaraPerKec.has(kecId)) {
            suaraPerKec.set(kecId, suaraPerKec.get(kecId) + Number(s.suara_calon || 0));
          }
        });

        barChart.data.labels = cacheKec.map(k => k.nama_kecamatan);
        barChart.data.datasets[0].data = cacheKec.map(k => ktpPerKec.get(k.id) || 0);
        barChart.data.datasets[1].data = cacheKec.map(k => suaraPerKec.get(k.id) || 0);
        barChart.update();
      } else {
        const kecObj = cacheKec.find(k => String(k.id) === selectedKecId);
        const namaKec = kecObj ? kecObj.nama_kecamatan : 'Kecamatan';
        judulEl.textContent = `📈 KTP VS SUARA PER DESA • ${namaKec.toUpperCase()}`;

        const desaDiKec = cacheDesa.filter(d => String(d.kecamatan_id) === selectedKecId);
        const ktpPerDesa = new Map();
        const suaraPerDesa = new Map();
        desaDiKec.forEach(d => {
          ktpPerDesa.set(d.id, 0);
          suaraPerDesa.set(d.id, 0);
        });

        cacheKtpRows.forEach(row => {
          if (row.desa_id && ktpPerDesa.has(row.desa_id)) {
            ktpPerDesa.set(row.desa_id, ktpPerDesa.get(row.desa_id) + 1);
          }
        });

        cacheSuaraList.forEach(s => {
          if (s.desa_id && suaraPerDesa.has(s.desa_id)) {
            suaraPerDesa.set(s.desa_id, suaraPerDesa.get(s.desa_id) + Number(s.suara_calon || 0));
          }
        });

        barChart.data.labels = desaDiKec.map(d => d.nama_desa);
        barChart.data.datasets[0].data = desaDiKec.map(d => ktpPerDesa.get(d.id) || 0);
        barChart.data.datasets[1].data = desaDiKec.map(d => suaraPerDesa.get(d.id) || 0);
        barChart.update();
      }
    }

    async function muatDashboardLive() {
      const statusEl = document.getElementById('statusLive');

      try {
        const [
          { data: dKec, error: errKec },
          { data: dDesa, error: errDesa },
          { data: dTpsRows, count: totalTps, error: errTps },
          { data: dKtpRows, count: totalKtp, error: errKtp },
          { data: dSuara, error: errSuara }
        ] = await Promise.all([
          supabase.from('kecamatan').select('id, nama_kecamatan').order('nama_kecamatan', { ascending: true }),
          supabase.from('desa').select('id, nama_desa, kecamatan_id, target_ktp').order('nama_desa', { ascending: true }),
          supabase.from('tps').select('id, desa_id'),
          supabase.from('data_ktp').select('id, desa_id, desa(kecamatan_id)', { count: 'exact' }),
          supabase.from('suara_tps').select('desa_id, suara_calon, desa(kecamatan_id)')
        ]);

        if (errKec || errDesa || errTps || errKtp || errSuara) {
          throw errKec || errDesa || errTps || errKtp || errSuara;
        }

        cacheKec = dKec || [];
        cacheDesa = dDesa || [];
        cacheKtpRows = dKtpRows || [];
        cacheSuaraList = dSuara || [];

        // Perbarui opsi dropdown kecamatan sambil mempertahankan pilihan aktif
        const pilihanLama = filterKecEl.value;
        filterKecEl.innerHTML =
          '<option value="">Semua Kecamatan (Rekap Kecamatan)</option>' +
          cacheKec.map(k => `<option value="${k.id}">📍 ${k.nama_kecamatan}</option>`).join('');
        filterKecEl.value = pilihanLama;

        const ktpMasuk = Number(totalKtp ?? cacheKtpRows.length);
        const tpsList = dTpsRows || [];
        const tpsSemua = Number(totalTps ?? tpsList.length);
        const targetKtp = cacheDesa.reduce((acc, d) => acc + Number(d.target_ktp || 0), 0);

        const persenRaw = targetKtp > 0 ? (ktpMasuk / targetKtp) * 100 : 0;
        const persenBulat = targetKtp > 0
          ? (persenRaw > 0 && persenRaw < 1 ? 1 : Math.min(100, Math.round(persenRaw)))
          : 0;
        const sisaPersen = Math.max(0, 100 - persenBulat);

        const totalSuara = cacheSuaraList.reduce((acc, s) => acc + Number(s.suara_calon || 0), 0);
        const tpsMasuk = cacheSuaraList.length;

        const countPerDesa = new Map();
        tpsList.forEach(t => {
          if (t.desa_id) {
            countPerDesa.set(t.desa_id, (countPerDesa.get(t.desa_id) || 0) + 1);
          }
        });

        const nextSlides = [
          { jumlah: tpsSemua, label: '🗳️ Total Semua TPS' }
        ];

        cacheDesa.forEach(d => {
          const jml = countPerDesa.get(d.id) || 0;
          if (jml > 0) {
            nextSlides.push({
              jumlah: jml,
              label: `🏘️ ${d.nama_desa}`
            });
          }
        });

        slidesTps = nextSlides;
        slideIndex = 0;

        document.getElementById('statKtp').textContent = `${ktpMasuk.toLocaleString('id-ID')} / ${targetKtp.toLocaleString('id-ID')}`;
        document.getElementById('ketPersenKtp').textContent = `✅ ${persenBulat}% Target`;

        document.getElementById('statSuara').textContent = totalSuara.toLocaleString('id-ID');
        document.getElementById('ketTpsMasuk').textContent = `✅ ${tpsMasuk.toLocaleString('id-ID')} / ${tpsSemua.toLocaleString('id-ID')} TPS`;

        document.getElementById('statTarget').textContent = targetKtp.toLocaleString('id-ID');
        tampilkanSlideTps();

        if (donutChart) {
          donutChart.data.datasets[0].data = targetKtp > 0 ? [persenBulat, sisaPersen] : [0, 100];
          donutChart.update();
        }

        updateGrafikBatang();

        statusEl.textContent = '🟢 Live • Terhubung';
        document.getElementById('lastUpdateText').textContent =
          `Pembaruan terakhir: ${new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' })} WIB`;
      } catch (err) {
        statusEl.textContent = '🔴 Gagal memuat data';
        document.getElementById('lastUpdateText').textContent = `Error: ${err.message}`;
      }
    }

    filterKecEl.addEventListener('change', updateGrafikBatang);

    initCharts();
    await muatDashboardLive();

    supabase
      .channel('pantau-live-dashboard')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'data_ktp' }, muatDashboardLive)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'suara_tps' }, muatDashboardLive)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'desa' }, muatDashboardLive)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tps' }, muatDashboardLive)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'kecamatan' }, muatDashboardLive)
      .subscribe();
  </script>
</body>
</html>
