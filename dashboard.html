<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Kerja — Rekapitulasi Pemilu</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #1e3a8a;
      --primary-soft: #dbeafe;
      --green: #059669;
      --green-soft: #d1fae5;
      --red: #dc2626;
      --red-soft: #fee2e2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 40px;
    }

    /* Topbar */
    .topbar {
      background: var(--primary);
      color: #fff;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .user-name {
      font-size: 15px;
      font-weight: 700;
    }

    .user-role {
      font-size: 12px;
      color: #bfdbfe;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.12);
      color: #fff;
      cursor: pointer;
    }

    /* Tab Menu */
    .nav-tabs {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      white-space: nowrap;
      padding: 0 12px;
    }

    .nav-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      padding: 12px 14px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* Workspace */
    .container {
      max-width: 800px;
      margin: 16px auto 0;
      padding: 0 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .card h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 520px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .form-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: #fff;
      color: var(--text);
    }

    .btn-primary {
      width: 100%;
      padding: 11px 14px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 9px;
      cursor: pointer;
    }

    .btn-primary:disabled {
      opacity: 0.6;
    }

    .msg {
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    .msg.ok { background: var(--green-soft); color: #065f46; display: block; }
    .msg.err { background: var(--red-soft); color: #991b1b; display: block; }

    .list-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .badge.off {
      background: var(--red-soft);
      color: var(--red);
    }

    .btn-mini {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="user-name" id="userName">Memuat profil...</div>
        <div class="user-role" id="userRole">-</div>
      </div>
      <div class="top-actions">
        <a href="index.html" class="btn-sm">Pantau Live</a>
        <button id="btnLogout" class="btn-sm">Keluar</button>
      </div>
    </div>
  </header>

  <nav class="nav-tabs">
    <div class="nav-inner" id="tabBar"></div>
  </nav>

  <main class="container" id="workspace">
    <div class="card">Memuat ruang kerja...</div>
  </main>

  <script type="module">
    import { supabase } from './js/config.js';

    const labelRole = {
      super_admin: 'Super Admin Kecamatan',
      admin_desa: 'Admin Desa',
      pengepul: 'Pengepul KTP',
      saksi: 'Saksi TPS'
    };

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.replace('login.html');
    }

    const { data: profil, error } = await supabase
      .from('users_tim')
      .select('*, desa(nama_desa), tps(nomor_tps)')
      .eq('id', session.user.id)
      .single();

    if (error || !profil || !profil.aktif) {
      await supabase.auth.signOut();
      window.location.replace('login.html');
    }

    document.getElementById('userName').textContent = profil.nama_lengkap;
    const infoWilayah = profil.desa?.nama_desa
      ? ` • ${profil.desa.nama_desa}${profil.tps?.nomor_tps ? ' (TPS ' + profil.tps.nomor_tps + ')' : ''}`
      : '';
    document.getElementById('userRole').textContent = `${labelRole[profil.role] || profil.role}${infoWilayah}`;

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.replace('login.html');
    });

    // Susun menu sesuai role
    const menus = [];
    if (profil.role === 'super_admin') {
      menus.push({ id: 'wilayah', label: '1. Wilayah & TPS', file: './modules/admin-wilayah.js' });
      menus.push({ id: 'akun', label: '2. Akun Tim', file: './modules/admin-akun.js' });
      menus.push({ id: 'ktp', label: '3. Data KTP', file: './modules/ktp-manager.js' });
      menus.push({ id: 'suara', label: '4. Suara TPS', file: null });
    } else if (profil.role === 'admin_desa') {
      menus.push({ id: 'wilayah', label: 'TPS Desa', file: './modules/admin-wilayah.js' });
      menus.push({ id: 'ktp', label: 'Data KTP', file: './modules/ktp-manager.js' });
      menus.push({ id: 'suara', label: 'Suara TPS', file: null });
    } else if (profil.role === 'pengepul') {
      menus.push({ id: 'ktp', label: 'Input & Rekap KTP', file: './modules/ktp-manager.js' });
    } else if (profil.role === 'saksi') {
      menus.push({ id: 'suara', label: 'Input Suara TPS', file: null });
    }

    const tabBar = document.getElementById('tabBar');
    const workspace = document.getElementById('workspace');

    async function bukaTab(menu, btnEl) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');

      if (!menu.file) {
        workspace.innerHTML = `
          <div class="card">
            <h2>${menu.label}</h2>
            <p style="font-size:14px; color:#64748b;">
              Modul ini siap kita pasang di tahap berikutnya setelah data Desa, TPS, dan Akun Tim selesai diisi.
            </p>
          </div>`;
        return;
      }

      workspace.innerHTML = `<div class="card">Memuat ${menu.label}...</div>`;
      const mod = await import(`./js/${menu.file.replace('./', '')}`);
      await mod.render(workspace, profil);
    }

    menus.forEach((m, idx) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      btn.textContent = m.label;
      btn.addEventListener('click', () => bukaTab(m, btn));
      tabBar.appendChild(btn);
      if (idx === 0) bukaTab(m, btn);
    });
  </script>
</body>
</html>
