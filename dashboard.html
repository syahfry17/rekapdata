<!-- NAVIGASI TAB 4 KOLOM -->
<nav class="tab-nav-4" aria-label="Menu Panel Admin">
  <button type="button" class="tab-item-4 is-active" data-tab="wilayah">
    <span class="tab-icon-4">🗺️</span>
    <span class="tab-label-4">Wilayah &amp; TPS</span>
  </button>

  <button type="button" class="tab-item-4" data-tab="akun">
    <span class="tab-icon-4">👥</span>
    <span class="tab-label-4">Akun Tim</span>
  </button>

  <button type="button" class="tab-item-4" data-tab="ktp">
    <span class="tab-icon-4">🪪</span>
    <span class="tab-label-4">Data KTP</span>
  </button>

  <button type="button" class="tab-item-4" data-tab="suara">
    <span class="tab-icon-4">🗳️</span>
    <span class="tab-label-4">Suara</span>
  </button>
</nav>

<style>
  .tab-nav-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    align-items: center;
    background: #ffffff;
    border-bottom: 1.5px solid #cbd5e1;
    width: 100%;
  }

  .tab-item-4 {
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    background: transparent;
    border: none;
    border-bottom: 2.5px solid transparent;
    padding: 12px 6px;
    margin-bottom: -1.5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    color: #1e293b;
    transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }

  .tab-item-4:hover {
    background: #f8fafc;
  }

  .tab-icon-4 {
    font-size: 20px;
    line-height: 1;
  }

  .tab-label-4 {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.25;
    text-align: center;
    white-space: nowrap;
  }

  .tab-item-4.is-active {
    color: #0f172a;
    border-bottom-color: #1E4BB8;
  }

  .tab-item-4.is-active .tab-label-4 {
    font-weight: 800;
  }

  @media (max-width: 420px) {
    .tab-label-4 {
      font-size: 11.5px;
      letter-spacing: -0.2px;
    }

    .tab-icon-4 {
      font-size: 18px;
    }
  }
</style>

<script>
  function initTabNav4(onTabChange) {
    const nav = document.querySelector('.tab-nav-4');
    if (!nav) return;

    const buttons = Array.from(nav.querySelectorAll('.tab-item-4'));

    function setActiveTab(tabKey, triggerCallback = true) {
      buttons.forEach(btn => {
        const aktif = btn.dataset.tab === tabKey;
        btn.classList.toggle('is-active', aktif);
        btn.setAttribute('aria-selected', aktif ? 'true' : 'false');
      });
      if (triggerCallback && typeof onTabChange === 'function') {
        onTabChange(tabKey);
      }
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        setActiveTab(btn.dataset.tab, true);
      });
    });

    // Aktifkan tab pertama secara default
    if (buttons[0]) {
      setActiveTab(buttons[0].dataset.tab, false);
    }

    return { setActiveTab };
  }

  // Contoh pemakaian untuk menampilkan / menyembunyikan section konten:
  initTabNav4((tabAktif) => {
    document.querySelectorAll('[data-panel]').forEach(panel => {
      panel.style.display = panel.dataset.panel === tabAktif ? 'block' : 'none';
    });
  });
</script>
